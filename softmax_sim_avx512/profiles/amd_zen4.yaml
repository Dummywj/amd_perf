  "vmaxps:ymm,ymm,ymm": *xmm_max_recipe
  "vmaxps:zmm,zmm,zmm": &zmm_max_recipe
    required_features: [avx512f]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    vector_decomposition: {parts: 2, part_width_bits: 256, part_issue_gap_cycles: 1}
    uops:
      - id: max-part-0
        kind: vector_fp
