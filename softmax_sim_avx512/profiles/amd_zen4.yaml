schema_version: 3
profile_id: amd-zen4-epyc-9684x
profile_status: calibrated
description: >-
  Cycle-level profile for straight-line AVX-512 kernels used in LLM inference
  on AMD EPYC 9684X, calibrated by single-core microbenchmarks.

cpu:
  vendor: AuthenticAMD
  family: "19h"
  model: "11h"
  stepping: "2"
  microarchitecture: zen4
  product_names:
    - AMD EPYC 9684X 96-Core Processor

isa:
  required_features:
    - avx2
    - fma
    - avx512f
    - avx512dq
    - avx512bw
    - avx512vl
    - avx512_bf16
    - avx512_vnni
  zmm_registers: 32
  max_vector_bits: 512

pipeline:
  dispatch_macro_ops_per_cycle: 6
  retire_macro_ops_per_cycle: 6
  rob_entries: 320
  vector_scheduler_entries: 64
  load_queue_entries: 44
  store_queue_entries: 68

resources:
  vector-fp:
    kind: vector_fp
    capacity: 4
    width_bits: 256
    notes: >-
      Aggregate Zen 4 FP/vector execution pipes. Each opcode still needs a
      measured eligibility set; capacity 4 does not mean every opcode uses all pipes.
  vector-integer:
    kind: vector_integer
    capacity: 4
    width_bits: 256
  shuffle:
    kind: shuffle
    capacity: 2
    width_bits: 256
    notes: Only basic permute/reduction support is in scope.
  conversion:
    kind: conversion
    capacity: 2
    width_bits: 256
  address-generation:
    kind: address_generation
    capacity: 3
  load-data:
    kind: load_data
    capacity: 2
    bytes_per_cycle: 62
  store-data:
    kind: store_data
    capacity: 1
    bytes_per_cycle: 32

issue_domains:
  fp-add-fma-convert:
    capacity: 2
    evidence: [local-profile-benchmark]
    notes: >-
      YMM add+FMA and add+conversion mixed streams sustain about two total
      instructions per cycle. This is an effective eligibility constraint on
      top of the four-pipe aggregate vector-fp resource.

recipes:
  "vaddps:zmm,zmm,zmm":
    required_features:
      - avx512f
    decoded_macro_ops: 1
    retire_macro_ops: 1
    vector_decomposition:
      parts: 2
      part_width_bits: 256
      part_issue_gap_cycles: 1
    uops:
      - id: add-part-0
        kind: vector_fp
        latency_cycles: 3
        issue_interval_cycles: 0.5
        resource_choices:
          - vector-fp
        resource_occupancy_cycles: 1
        issue_domains: [fp-add-fma-convert]
        part_index: 0
      - id: add-part-1
        kind: vector_fp
        latency_cycles: 3
        issue_interval_cycles: 0.5
        resource_choices:
          - vector-fp
        resource_occupancy_cycles: 1
        issue_domains: [fp-add-fma-convert]
        part_index: 1
    evidence:
      - amd-zen4-sog
      - amd-epyc-9004-whitepaper
      - provisional-vaddps-model
      - local-profile-benchmark
    notes: >-
      The two uops are an effective simulator decomposition, not a claim about
      the exact hidden hardware uop count. Latency, throughput and occupancy are
      calibrated effective values; physical pipe eligibility remains unknown.
  "vmovups:memory,zmm":
    required_features: [avx512f]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: agu
        kind: address_generation
        latency_cycles: 0
        issue_interval_cycles: 1
        resource_choices: [address-generation]
        resource_occupancy_cycles: 1
      - id: load
        kind: load_data
        latency_cycles: 4
        issue_interval_cycles: 0.5
        resource_choices: [load-data]
        resource_occupancy_cycles: 1
        depends_on: [agu]
    evidence: [local-profile-benchmark, llvm-znver4-scheduling-model]
  "vmovups:zmm,memory":
    required_features: [avx512f]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: agu
        kind: address_generation
        latency_cycles: 0
        issue_interval_cycles: 1
        resource_choices: [address-generation]
        resource_occupancy_cycles: 1
      - id: store
        kind: store_data
        latency_cycles: 1
        issue_interval_cycles: 1
        resource_choices: [store-data]
        resource_occupancy_cycles: 2
        depends_on: [agu]
    evidence: [local-profile-benchmark, llvm-znver4-scheduling-model]
  "vmovss:memory,xmm":
    required_features: [avx]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: agu
        kind: address_generation
        latency_cycles: 0
        issue_interval_cycles: 1
        resource_choices: [address-generation]
        resource_occupancy_cycles: 1
      - id: load
        kind: load_data
        latency_cycles: 4
        issue_interval_cycles: 0.5
        resource_choices: [load-data]
        resource_occupancy_cycles: 1
        depends_on: [agu]
    evidence: [local-profile-benchmark, llvm-znver4-scheduling-model]
  "vbroadcastss:memory,zmm":
    required_features: [avx512f]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: agu
        kind: address_generation
        latency_cycles: 0
        issue_interval_cycles: 1
        resource_choices: [address-generation]
        resource_occupancy_cycles: 1
      - id: load
        kind: load_data
        latency_cycles: 4
        issue_interval_cycles: 0.5
        resource_choices: [load-data]
        resource_occupancy_cycles: 1
        depends_on: [agu]
      - id: broadcast
        kind: vector_fp
        latency_cycles: 2
        issue_interval_cycles: 1
        resource_choices: [vector-fp]
        resource_occupancy_cycles: 1
        depends_on: [load]
    evidence: [llvm-znver4-scheduling-model]
  "vbroadcastss:xmm,zmm":
    required_features: [avx512f]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: broadcast
        kind: vector_fp
        latency_cycles: 2
        issue_interval_cycles: 1
        resource_choices: [vector-fp]
        resource_occupancy_cycles: 1
    evidence: [llvm-znver4-scheduling-model]
  "vpbroadcastd:register,zmm":
    required_features: [avx512f]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: broadcast
        kind: vector_integer
        latency_cycles: 1
        issue_interval_cycles: 1
        resource_choices: [vector-integer]
        resource_occupancy_cycles: 1
    evidence: [llvm-znver4-scheduling-model]
  "vmovaps:zmm,zmm": &vector_move_recipe
    required_features: [avx512f]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: move
        kind: vector_fp
        latency_cycles: 0
        issue_interval_cycles: 0.5
        resource_choices: [vector-fp]
        resource_occupancy_cycles: 1
    evidence: [llvm-znver4-scheduling-model]
    notes: LLVM models these eliminated register moves as zero latency.
  "vmovaps:xmm,xmm": *vector_move_recipe
  "vxorps:xmm,xmm,xmm": *vector_move_recipe
  "vextractf64x4:immediate,zmm,ymm":
    required_features: [avx512dq]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: shuffle
        kind: shuffle
        latency_cycles: 2
        issue_interval_cycles: 1
        resource_choices: [shuffle]
        resource_occupancy_cycles: 1
    evidence: [llvm-znver4-scheduling-model]
  "vextractf128:immediate,ymm,xmm":
    required_features: [avx]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: shuffle
        kind: shuffle
        latency_cycles: 4
        issue_interval_cycles: 1
        resource_choices: [shuffle]
        resource_occupancy_cycles: 1
    evidence: [llvm-znver4-scheduling-model]
  "vpermilps:immediate,xmm,xmm": &xmm_shuffle_recipe
    required_features: [avx]
    decoded_macro_ops: 1
    retire_macro_ops: 1
    uops:
      - id: shuffle
        kind: shuffle
        latency_cycles: 1
        issue_interval_cycles: 0.5
        resource_choices: [shuffle]
        resource_occupancy_cycles: 1
    evidence: [llvm-znver4-scheduling-model]
  "vshufps:immediate,xmm,xmm,xmm": *xmm_shuffle_recipe
  "vmaxps:xmm,xmm,xmm": &xmm_max_recipe
    required_features: [avx]
    decoded_macro_ops: 1
