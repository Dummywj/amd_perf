    vector_decomposition: {parts: 2, part_width_bits: 256, part_issue_gap_cycles: 1}
    uops:
      - id: fp-part-0
        kind: vector_fp
        latency_cycles: 3
        issue_interval_cycles: 0.5
        resource_choices: [vector-fp]
