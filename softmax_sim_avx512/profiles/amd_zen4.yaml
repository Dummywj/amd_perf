        issue_interval_cycles: 0.5
        resource_choices: [load-data]
        resource_occupancy_cycles: 1
        depends_on: [agu]
      - id: max-part-0
        kind: vector_fp
        latency_cycles: 2
        issue_interval_cycles: 0.5
        resource_choices: [vector-fp]
        resource_occupancy_cycles: 1
        depends_on: [load]
        part_index: 0
      - id: max-part-1
        kind: vector_fp
        latency_cycles: 2
        issue_interval_cycles: 0.5
        resource_choices: [vector-fp]
        resource_occupancy_cycles: 1
        depends_on: [load]
        part_index: 1
    evidence: [local-profile-benchmark, amd-epyc-9004-whitepaper, llvm-znver4-scheduling-model]
  "vsubps:zmm,zmm,zmm": &zmm_fp_three_cycle_recipe
    required_features: [avx512f]
    decoded_macro_ops: 1
