scalar_control_fit:
  enabled: true
  resources:
    scalar-alu-fit:
      capacity: 4
      notes: Effective aggregate integer/address-side scalar execution slots.
    scalar-fp-fit:
      capacity: 2
      notes: Effective scalar floating-point add slots.
    scalar-div-fit:
      capacity: 1
      notes: Effective non-pipelined portion of scalar floating-point division.
    branch-fit:
      capacity: 2
      notes: Effective predicted-branch issue slots; no misprediction model.
  uops:
    scalar_alu:
      latency_cycles: 1
      issue_interval_cycles: 0.5
      resource_occupancy_cycles: 1
      resource_choices: [scalar-alu-fit]
    scalar_fp_add:
      latency_cycles: 3
      issue_interval_cycles: 0.5
      resource_occupancy_cycles: 1
      resource_choices: [scalar-fp-fit]
    scalar_fp_div:
      latency_cycles: 11
      issue_interval_cycles: 3
      resource_occupancy_cycles: 3
      resource_choices: [scalar-div-fit]
    scalar_move:
      latency_cycles: 1
      issue_interval_cycles: 0.5
      resource_occupancy_cycles: 1
      resource_choices: [scalar-alu-fit]
    branch:
      latency_cycles: 1
      issue_interval_cycles: 0.5
      resource_occupancy_cycles: 1
      resource_choices: [branch-fit]
    return:
      latency_cycles: 5
      issue_interval_cycles: 0.5
      resource_occupancy_cycles: 1
      resource_choices: [branch-fit]
  evidence:
    - llvm-znver4-scheduling-model
  notes: >-
    Provisional effective fallback values for scalar/control semantic uops.
    They participate in dependencies and resource scheduling; they are not a
    constant added to total softmax cycles. Existing vector, pipeline and
    memory calibration values remain frozen.

memory:
  cache_line_bytes: 64
  levels:
    l1d:
      size_bytes: 32768
      ways: 8
      latency_cycles: 4
      read_bytes_per_cycle: 62
      write_bytes_per_cycle: 32
      max_outstanding_misses: 10
      shared_by_cores: 1
    l2:
      size_bytes: 1048576
      ways: 8
      latency_cycles: 14
      read_bytes_per_cycle: 32
      write_bytes_per_cycle: 31
      max_outstanding_misses: 20
      shared_by_cores: 1
    l3-ccd:
      size_bytes: 100663296
      ways: 16
      latency_cycles: 54
      read_bytes_per_cycle: 24
      write_bytes_per_cycle: 27
      max_outstanding_misses: 28
      shared_by_cores: 8
      notes: 96 MiB per CCD on this EPYC 9684X host with 3D V-Cache.
  dram:
    latency_cycles: 373
    read_bytes_per_cycle: 9
    write_bytes_per_cycle: 9
    max_outstanding_requests: 28
    notes: Values are effective single-core, NUMA-local cycle parameters.

metadata:
  created_at: "2026-08-05T11:49:44+08:00"
  last_calibrated_at: "2026-08-05T15:36:05+08:00"
  simulator_min_version: "0.3.0-dev"
  sources:
    - id: amd-zen4-sog
      kind: vendor_document
      title: Software Optimization Guide for AMD Family 19h Processors
      uri: https://www.amd.com/content/dam/amd/en/documents/processor-tech-docs/software-optimization-guides/57647.zip
      accessed_on: "2026-08-05"
      notes: >-
        Zen 4 dispatch width, reorder capacity, scheduler organization and
        execution-pipe organization.
    - id: amd-epyc-9004-whitepaper
      kind: vendor_document
      title: 4th Gen AMD EPYC Processor Architecture White Paper
      uri: https://www.amd.com/content/dam/amd/en/documents/products/epyc/4th-gen-amd-epyc-processor-architecture-whitepaper.pdf
      accessed_on: "2026-08-05"
      notes: >-
        Zen 4 cache organization and two-cycle execution of 512-bit AVX data
        on internal 256-bit data paths.
    - id: local-cpu-info
      kind: measurement
      title: Target Host CPU Inventory
      uri: ../../docs/cpu-info.md
      accessed_on: "2026-08-05"
      command: lscpu
    - id: local-cache-sysfs
      kind: measurement
      title: Target Host Linux Cache Topology
      uri: /sys/devices/system/cpu/cpu0/cache/
      accessed_on: "2026-08-05"
      command: >-
        read cpu0 cache level, type, size, line size, ways and shared_cpu_list
    - id: provisional-vaddps-model
      kind: assumption
      title: Provisional Zen 4 VADDPS Simulator Decomposition
      accessed_on: "2026-08-05"
      notes: >-
        Represents the documented two-part datapath as two effective simulator
        uops; physical uop count and exact pipe eligibility remain unknown.
    - id: local-profile-benchmark
      kind: measurement
      title: AMD EPYC 9684X Profile Benchmark
      uri: ../../amd_profile_benchmark/result.md
      accessed_on: "2026-08-05"
      command: >-
        amd_profile_benchmark/scripts/run_all.sh
        amd_profile_benchmark/results/zen4-20260805
      notes: >-
        Seven repetitions pinned to CPU 8 and NUMA node 0. The SMT sibling was
        idle; all PMU groups had a running ratio of 1.0.
    - id: llvm-znver4-scheduling-model
      kind: assumption
      title: LLVM znver4 scheduling model audit for scalar and control forms
      uri: https://llvm.org/docs/CommandGuide/llvm-mca.html
      accessed_on: "2026-08-05"
      command: >-
        llvm-mca -mtriple=x86_64 -mcpu=znver4 -iterations=1 -timeline
        softmax_sim_avx512/kernel/softmax/artifacts/x86/softmax_avx512.s
      notes: >-
        Provides auditable initial effective values only. These fields must be
        trained and validated separately from the frozen vector/memory fields.
  notes: >-
    This profile intentionally omits masks, gathers/scatters, slide-like
    operations, branch prediction, detailed frontend state, TLB, prefetch state
    machines and frequency. Missing instruction recipes are hard errors, not
    defaults.

evidence:
  - parameter: cpu
    sources: [local-cpu-info]
    confidence: high
  - parameter: isa
    sources: [local-cpu-info, amd-epyc-9004-whitepaper]
    confidence: high
  - parameter: pipeline.dispatch_macro_ops_per_cycle
    sources: [amd-zen4-sog, local-profile-benchmark]
    confidence: high
  - parameter: pipeline.retire_macro_ops_per_cycle
    sources: [local-profile-benchmark]
    confidence: medium
    notes: Sustained effective value; the instantaneous retirement peak was not isolated.
  - parameter: pipeline.rob_entries
    sources: [amd-zen4-sog, local-profile-benchmark]
    confidence: high
    notes: 320 macro-ops without SMT; the profile assumes the sibling thread is idle.
  - parameter: pipeline.vector_scheduler_entries
    sources: [amd-zen4-sog, local-profile-benchmark]
    confidence: high
    notes: Aggregate of two partitioned 32-entry FP schedulers.
  - parameter: pipeline.load_queue_entries
