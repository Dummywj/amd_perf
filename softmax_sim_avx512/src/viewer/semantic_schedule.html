<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic uop schedule</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f7;
      --surface: #ffffff;
      --line: #d9dedb;
      --line-strong: #b5bdb8;
      --text: #17211b;
      --muted: #66716a;
      --accent: #176b57;
      --accent-soft: #dceee8;
      --instruction: #315f91;
      --semantic: #16806a;
      --execution: #7c5a21;
      --waiting: #adb5b0;
      --executing: #15926f;
      --retire: #d59b34;
      --selected: #e7f1ec;
      --row-height: 20px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    button, input { font: inherit; letter-spacing: 0; }

    button {
      min-height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button:focus-visible, input:focus-visible { outline: 2px solid #65a895; outline-offset: 1px; }

    .app {
      display: grid;
      grid-template-rows: 48px 26px minmax(0, 1fr);
      width: 100%;
      height: 100%;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .brand { min-width: 190px; }
    .brand h1 { margin: 0; font-size: 15px; line-height: 18px; letter-spacing: 0; }
    .brand-meta { color: var(--muted); font-size: 11px; white-space: nowrap; }

    .search {
      width: min(310px, 28vw);
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fbfcfb;
      color: var(--text);
    }

    .toolbar-spacer { flex: 1; min-width: 8px; }

    .control-group { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .control-group button { min-width: 32px; padding: 0 9px; }

    .segmented { display: inline-flex; }
    .segmented button { border-radius: 0; margin-left: -1px; }
    .segmented button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
    .segmented button:last-child { border-radius: 0 5px 5px 0; }
    .segmented button.active { z-index: 1; border-color: var(--accent); background: var(--accent-soft); color: #0b4f3e; }

    .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .toggle input { accent-color: var(--accent); }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: #f1f4f2;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
    }

    .workspace {
      position: relative;
      display: grid;
      grid-template-columns: minmax(235px, 285px) minmax(360px, 1fr) minmax(245px, 285px);
      min-height: 0;
      background: var(--surface);
    }

    .labels-panel, .timeline-panel, .details-panel { min-width: 0; min-height: 0; }
    .labels-panel, .timeline-panel { display: grid; grid-template-rows: 29px 22px minmax(0, 1fr); }
    .labels-panel { border-right: 1px solid var(--line); }
    .timeline-panel { border-right: 1px solid var(--line); }

    .panel-header {
      display: flex;
      align-items: center;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      background: #f8faf8;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .axis-header {
      display: flex;
      align-items: center;
      min-width: 0;
      border-bottom: 1px solid var(--line);
      background: #f3f6f4;
      color: var(--muted);
      font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
    }

    .labels-panel .axis-header { padding-left: 10px; }
    #axisCanvas { display: block; width: 100%; height: 21px; }

    .label-stage, .timeline-stage { position: relative; min-height: 0; overflow: hidden; }
    .label-stage { background: #fbfcfb; }

    #labelRows { position: absolute; inset: 0; overflow: hidden; }

    .label-row {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      height: var(--row-height);
      padding-right: 6px;
      border-bottom: 1px solid #edf0ee;
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
    }

    .label-row:hover { background: #eef4f1; }
    .label-row.selected { background: var(--selected); }
    .label-row.semantic { color: #155d4c; font-size: 11px; }
    .node-id { flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }
    .node-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    #timelineScroll { position: absolute; inset: 0; overflow: auto; }
    #timelineSpacer { pointer-events: none; }
    #timelineCanvas, #dependencySvg { position: absolute; inset: 0; pointer-events: none; }
    #dependencySvg { overflow: visible; }

    .details-panel {
      display: grid;
      grid-template-rows: 29px minmax(0, 1fr);
      background: #fbfcfb;
    }

    #details { overflow: auto; padding: 9px 11px 20px; }
    .empty-details { margin-top: 20px; color: var(--muted); text-align: center; }
    .detail-title { margin: 0; font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
    .detail-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .detail-section { margin-top: 17px; }
    .detail-section h3 { margin: 0 0 7px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0; }

    .detail-grid { display: grid; grid-template-columns: minmax(86px, auto) minmax(0, 1fr); gap: 6px 10px; }
    .detail-key { color: var(--muted); }
    .detail-value { min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .operand-list, .link-list { display: grid; gap: 5px; }
    .operand {
      padding: 6px 7px;
      border-left: 3px solid var(--line-strong);
      background: #f1f4f2;
      border-radius: 0 4px 4px 0;
      overflow-wrap: anywhere;
    }
    .operand-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .operand-meta { margin-top: 2px; color: var(--muted); font-size: 10px; }

    .node-link {
      width: 100%;
      min-height: 26px;
      padding: 3px 7px;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .node-reference {
      min-height: 24px;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #f3f5f4;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    button:disabled { cursor: default; opacity: 0.45; }

    .legend { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; font-weight: 500; text-transform: none; }
    .legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .legend-swatch { width: 12px; height: 6px; border-radius: 2px; }

    @media (max-width: 1050px) {
      .workspace { grid-template-columns: minmax(220px, 280px) minmax(360px, 1fr); }
      .details-panel {
        position: absolute;
        z-index: 5;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(330px, 45vw);
        border-left: 1px solid var(--line);
        box-shadow: -8px 0 18px rgb(20 45 34 / 10%);
      }
      .toolbar .brand-meta { display: none; }
    }

    @media (max-width: 760px) {
      .app { grid-template-rows: auto 30px minmax(0, 1fr); }
      .toolbar { flex-wrap: wrap; }
      .brand { min-width: 145px; }
      .search { order: 3; width: 100%; }
      .workspace { grid-template-columns: minmax(200px, 39vw) minmax(360px, 1fr); }
      .details-panel { width: min(330px, 75vw); }
      .legend { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        <h1>Semantic Schedule</h1>
        <div class="brand-meta" id="brandMeta"></div>
      </div>
      <input class="search" id="search" type="search" placeholder="ID, kind, assembly" aria-label="Find a schedule node">
      <div class="control-group segmented" aria-label="Board mode">
        <button id="continuousMode" type="button" class="active">Continuous</button>
        <button id="discreteMode" type="button">Discrete</button>
      </div>
      <div class="toolbar-spacer"></div>
      <div class="control-group segmented" aria-label="Time unit">
        <button id="cycleMode" type="button" class="active">Cycle</button>
        <button id="tickMode" type="button">Tick</button>
      </div>
      <div class="control-group" id="zoomControls" aria-label="Zoom controls">
        <button id="zoomOut" type="button" title="Zoom out">-</button>
        <button id="zoomIn" type="button" title="Zoom in">+</button>
        <button id="fit" type="button" title="Fit the complete schedule">Fit</button>
      </div>
    </header>

    <div class="statusbar">
      <span id="statusCounts"></span>
      <span id="statusModel"></span>
      <span id="statusScale"></span>
    </div>

    <main class="workspace">
      <section class="labels-panel" aria-label="Schedule hierarchy">
        <div class="panel-header">Semantic uop</div>
        <div class="axis-header">Dynamic semantic node</div>
        <div class="label-stage" id="labelStage"><div id="labelRows"></div></div>
      </section>

      <section class="timeline-panel" aria-label="Cycle timeline">
        <div class="panel-header">
          Timeline
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch" id="waitingSwatch" style="background:var(--waiting)"></span><span id="waitingLegend">Waiting</span></span>
            <span class="legend-item"><span class="legend-swatch" id="executeSwatch" style="background:var(--executing)"></span><span id="executeLegend">Execute</span></span>
            <span class="legend-item"><span class="legend-swatch" id="retireSwatch" style="background:var(--retire)"></span><span id="retireLegend">Retire</span></span>
          </div>
        </div>
        <div class="axis-header"><canvas id="axisCanvas"></canvas></div>
        <div class="timeline-stage" id="timelineStage">
          <div id="timelineScroll"><div id="timelineSpacer"></div></div>
          <canvas id="timelineCanvas"></canvas>
          <svg id="dependencySvg" aria-hidden="true"></svg>
        </div>
      </section>

      <aside class="details-panel" aria-label="Selected node details">
        <div class="panel-header">Details</div>
        <div id="details"><div class="empty-details">Select a schedule row</div></div>
      </aside>
    </main>
  </div>

  <script id="trace-data" type="application/json">__SEMANTIC_TRACE_DATA__</script>
  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("trace-data").textContent);
      const metadata = data.metadata;
      const tpc = metadata.ticks_per_cycle;
      const rowHeight = 20;
      const leftPad = 14;
      const rightPad = 36;
      const discreteCellWidth = 8;
      const semanticMap = new Map(data.semantic_uops.map(node => [node.id, node]));
      const allNodes = semanticMap;

      const search = document.getElementById("search");
      const timelineStage = document.getElementById("timelineStage");
      const timelineScroll = document.getElementById("timelineScroll");
      const timelineSpacer = document.getElementById("timelineSpacer");
      const timelineCanvas = document.getElementById("timelineCanvas");
      const axisCanvas = document.getElementById("axisCanvas");
      const dependencySvg = document.getElementById("dependencySvg");
      const labelStage = document.getElementById("labelStage");
      const labelRows = document.getElementById("labelRows");
      const details = document.getElementById("details");
      const context = timelineCanvas.getContext("2d");
      const axisContext = axisCanvas.getContext("2d");
      const color = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      let rows = [];
      let rowIndexById = new Map();
      let selectedId = null;
      let timeMode = "cycle";
      let boardMode = "continuous";
      let pxPerCycle = 6;
      let dragging = null;

      document.getElementById("brandMeta").textContent = `${metadata.profile_id} / ${metadata.execution_model}`;
      document.getElementById("statusCounts").textContent = `${data.semantic_uops.length} semantic uops`;
      document.getElementById("statusModel").textContent = `${metadata.cache_mode} / ${formatNumber(metadata.cycles)} cycles`;

      function nodeText(node) {
        return `${node.id} ${node.kind} ${node.provenance.assembly}`;
      }

      function matches(node, query) {
        return !query || nodeText(node).toLowerCase().includes(query);
      }

      function rebuildRows() {
        const query = search.value.trim().toLowerCase();
        rows = data.semantic_uops
          .filter(node => matches(node, query))
          .map(node => ({node}));
        rowIndexById = new Map(rows.map((row, index) => [row.node.id, index]));
        updateSpacer();
        render();
      }

      function updateSpacer() {
        const width = Math.max(
          timelineStage.clientWidth,
          metadata.cycles * timelineScale() + leftPad + rightPad
        );
        timelineSpacer.style.width = `${Math.ceil(width)}px`;
        timelineSpacer.style.height = `${Math.max(rows.length * rowHeight, timelineStage.clientHeight)}px`;
        document.getElementById("statusScale").textContent = boardMode === "discrete"
          ? `${discreteCellWidth} px/cycle / fixed discrete timeline`
          : `${formatNumber(pxPerCycle)} px/cycle / ${tpc} ticks/cycle`;
      }

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        const width = timelineStage.clientWidth;
        const height = timelineStage.clientHeight;
        timelineCanvas.width = Math.max(1, Math.floor(width * ratio));
        timelineCanvas.height = Math.max(1, Math.floor(height * ratio));
        timelineCanvas.style.width = `${width}px`;
        timelineCanvas.style.height = `${height}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        axisCanvas.width = Math.max(1, Math.floor(width * ratio));
        axisCanvas.height = Math.max(1, Math.floor(21 * ratio));
        axisCanvas.style.width = `${width}px`;
        axisCanvas.style.height = "21px";
        axisContext.setTransform(ratio, 0, 0, ratio, 0, 0);
        dependencySvg.setAttribute("width", width);
        dependencySvg.setAttribute("height", height);
        dependencySvg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        updateSpacer();
        render();
      }

      function tickX(tick) {
        return leftPad + (tick / tpc) * timelineScale() - timelineScroll.scrollLeft;
      }

      function timelineScale() {
        return boardMode === "discrete" ? discreteCellWidth : pxPerCycle;
      }

      function visibleRange() {
        const start = Math.max(0, Math.floor(timelineScroll.scrollTop / rowHeight));
        const count = Math.ceil(timelineStage.clientHeight / rowHeight) + 2;
        return [start, Math.min(rows.length, start + count)];
      }

      function render() {
        renderLabels();
        renderCanvas();
        renderAxis();
        renderDependencies();
      }

      function renderLabels() {
        labelRows.replaceChildren();
        const [start, end] = visibleRange();
        const fragment = document.createDocumentFragment();
        for (let index = start; index < end; index += 1) {
          const row = rows[index];
          const node = row.node;
          const element = document.createElement("div");
          element.className = `label-row semantic${node.id === selectedId ? " selected" : ""}`;
          element.style.top = `${index * rowHeight - timelineScroll.scrollTop}px`;
          element.style.paddingLeft = "6px";
          element.dataset.nodeId = node.id;

          const id = document.createElement("span");
          id.className = "node-id";
          id.textContent = node.id;
          element.appendChild(id);

          const label = document.createElement("span");
          label.className = "node-label";
          label.textContent = node.kind;
          label.title = node.provenance.assembly;
          element.appendChild(label);
          fragment.appendChild(element);
        }
        labelRows.appendChild(fragment);
      }

      function renderCanvas() {
        const width = timelineStage.clientWidth;
        const height = timelineStage.clientHeight;
        context.clearRect(0, 0, width, height);
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, width, height);
        drawGrid(width, height);

        const [start, end] = visibleRange();
        for (let index = start; index < end; index += 1) {
          const node = rows[index].node;
          const y = index * rowHeight - timelineScroll.scrollTop;
          context.fillStyle = node.id === selectedId ? color("--selected") : index % 2 ? "#fbfcfb" : "#ffffff";
          context.fillRect(0, y, width, rowHeight);
          context.strokeStyle = "#edf0ee";
          context.beginPath();
          context.moveTo(0, y + rowHeight - 0.5);
          context.lineTo(width, y + rowHeight - 0.5);
          context.stroke();
          drawTiming(node, y);
        }
      }

      function drawGrid(width, height) {
        const step = gridStep();
        const scale = timelineScale();
        const visibleFirst = Math.max(
          0,
          Math.floor((timelineScroll.scrollLeft - leftPad) / scale)
        );
        if (boardMode === "discrete") {
          const visibleLast = Math.min(
            Math.ceil(metadata.cycles),
            Math.ceil((timelineScroll.scrollLeft + width - leftPad) / scale)
          );
          context.strokeStyle = "#f0f2f1";
          for (let cycle = visibleFirst; cycle <= visibleLast; cycle += 1) {
            const x = leftPad + cycle * scale - timelineScroll.scrollLeft;
            context.beginPath();
            context.moveTo(x + 0.5, 0);
            context.lineTo(x + 0.5, height);
            context.stroke();
          }
        }
        const firstCycle = Math.floor(visibleFirst / step) * step;
        for (let cycle = firstCycle; cycle <= metadata.cycles + step; cycle += step) {
          const x = leftPad + cycle * scale - timelineScroll.scrollLeft;
          if (x < -1 || x > width + 1) continue;
          context.strokeStyle = cycle === 0 ? "#aeb8b2" : "#e3e8e5";
          context.beginPath();
          context.moveTo(x + 0.5, 0);
          context.lineTo(x + 0.5, height);
          context.stroke();
        }
      }

      function renderAxis() {
        const width = timelineStage.clientWidth;
        axisContext.clearRect(0, 0, width, 21);
        axisContext.fillStyle = "#f3f6f4";
        axisContext.fillRect(0, 0, width, 21);
        axisContext.font = "10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
        axisContext.textBaseline = "middle";
        const step = gridStep();
        const scale = timelineScale();
        const firstCycle = Math.floor(
          Math.max(0, (timelineScroll.scrollLeft - leftPad) / scale) / step
        ) * step;
        for (let cycle = firstCycle; cycle <= metadata.cycles + step; cycle += step) {
          const x = leftPad + cycle * scale - timelineScroll.scrollLeft;
          if (x < -1 || x > width + 1) continue;
          axisContext.strokeStyle = cycle === 0 ? "#929d96" : "#cbd2ce";
          axisContext.beginPath();
          axisContext.moveTo(x + 0.5, 14);
          axisContext.lineTo(x + 0.5, 21);
          axisContext.stroke();
          axisContext.fillStyle = "#66716a";
          const label = timeMode === "tick" ? String(Math.round(cycle * tpc)) : formatNumber(cycle);
          axisContext.fillText(label, x + 3, 7);
        }
      }

      function drawTiming(node, y) {
        const timing = node.timing;
        if (timing.dispatch_tick == null || timing.issue_tick == null || timing.complete_tick == null) return;
        if (boardMode === "discrete") {
          drawDiscreteTiming(timing, y);
          return;
        }
        const dispatch = tickX(timing.dispatch_tick);
        const issue = tickX(timing.issue_tick);
        const complete = tickX(timing.complete_tick);
        const retireTick = timing.retire_tick == null ? timing.complete_tick : timing.retire_tick;
        const retire = tickX(retireTick);
        const barHeight = 8;
        const barY = y + Math.floor((rowHeight - barHeight) / 2);
        drawPhase(dispatch, issue, barY, barHeight, color("--waiting"));
        drawPhase(issue, complete, barY, barHeight, color("--executing"));
        drawPhase(complete, retire, barY, barHeight, color("--retire"));
        context.fillStyle = color("--semantic");
        context.fillRect(issue - 1, barY - 2, 2, barHeight + 4);
      }

      function drawDiscreteTiming(timing, y) {
        const retireTick = timing.retire_tick == null
          ? timing.complete_tick
          : timing.retire_tick;
        const firstCycle = Math.max(0, Math.floor(timing.dispatch_tick / tpc));
        const lastCycle = Math.ceil(retireTick / tpc);
        const visibleFirst = Math.max(
          firstCycle,
          Math.floor((timelineScroll.scrollLeft - leftPad) / discreteCellWidth)
        );
        const visibleLast = Math.min(
          lastCycle,
          Math.ceil(
            (timelineScroll.scrollLeft + timelineStage.clientWidth - leftPad) /
            discreteCellWidth
          )
        );
        context.font = "bold 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
        context.textAlign = "center";
        context.textBaseline = "middle";
        for (let cycle = visibleFirst; cycle < visibleLast; cycle += 1) {
          const cycleStart = cycle * tpc;
          const cycleEnd = cycleStart + tpc;
          let symbol = null;
          let fill = null;
          if (intervalOverlaps(cycleStart, cycleEnd, timing.issue_tick, timing.complete_tick)) {
            symbol = "x";
            fill = color("--executing");
          } else if (intervalOverlaps(cycleStart, cycleEnd, timing.complete_tick, retireTick)) {
            symbol = "o";
            fill = color("--retire");
          } else if (intervalOverlaps(cycleStart, cycleEnd, timing.dispatch_tick, timing.issue_tick)) {
            symbol = ".";
            fill = "#78817c";
          }
          if (symbol === null) continue;
          const x = leftPad + (cycle + 0.5) * discreteCellWidth - timelineScroll.scrollLeft;
          context.fillStyle = fill;
          context.fillText(symbol, x, y + rowHeight / 2);
        }
        context.textAlign = "start";
      }

      function intervalOverlaps(cycleStart, cycleEnd, phaseStart, phaseEnd) {
        return phaseEnd > phaseStart && phaseStart < cycleEnd && phaseEnd > cycleStart;
      }

      function drawPhase(start, end, y, height, fill) {
        if (end < -2 || start > timelineStage.clientWidth + 2) return;
        context.fillStyle = fill;
        context.fillRect(start, y, Math.max(1, end - start), height);
      }

      function gridStep() {
        const target = 85 / timelineScale();
        const power = Math.pow(10, Math.floor(Math.log10(Math.max(target, 0.001))));
        const normalized = target / power;
        const factor = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
        return factor * power;
      }

      function renderDependencies() {
        dependencySvg.replaceChildren();
        if (!selectedId) return;
        const selected = allNodes.get(selectedId);
        if (!selected) return;
        const direct = data.dependencies.filter(
          edge => edge.source === selectedId || edge.target === selectedId
        );
        for (const edge of direct) {
          if (!rowIndexById.has(edge.source) || !rowIndexById.has(edge.target)) continue;
          const source = allNodes.get(edge.source);
          const target = allNodes.get(edge.target);
          const x1 = tickX(source.timing.complete_tick ?? source.timing.issue_tick ?? 0);
          const x2 = tickX(target.timing.issue_tick ?? target.timing.dispatch_tick ?? 0);
          const y1 = rowIndexById.get(edge.source) * rowHeight - timelineScroll.scrollTop + rowHeight / 2;
          const y2 = rowIndexById.get(edge.target) * rowHeight - timelineScroll.scrollTop + rowHeight / 2;
          if (y1 < -rowHeight || y1 > timelineStage.clientHeight + rowHeight || y2 < -rowHeight || y2 > timelineStage.clientHeight + rowHeight) continue;
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          const bend = Math.max(18, Math.abs(x2 - x1) * 0.35);
          path.setAttribute("d", `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", dependencyColor(edge.kind));
          path.setAttribute("stroke-width", edge.source === selectedId ? "1.8" : "1.3");
          path.setAttribute("stroke-opacity", "0.9");
          dependencySvg.appendChild(path);
          const end = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          end.setAttribute("cx", x2);
          end.setAttribute("cy", y2);
          end.setAttribute("r", "2.8");
          end.setAttribute("fill", dependencyColor(edge.kind));
          dependencySvg.appendChild(end);
        }
      }

      function dependencyColor(kind) {
        if (kind === "memory") return "#b35e34";
        if (kind === "flags") return "#7554a3";
        if (kind === "part_order") return "#82745c";
        if (kind === "internal") return "#4d8c7a";
        return "#3f70a6";
      }

      function selectNode(id, scrollIntoView = false) {
        if (!allNodes.has(id)) return;
        selectedId = id;
        const node = allNodes.get(id);
        rebuildRows();
        if (scrollIntoView && rowIndexById.has(id)) {
          const rowTop = rowIndexById.get(id) * rowHeight;
          const margin = rowHeight * 3;
          if (rowTop < timelineScroll.scrollTop + margin || rowTop > timelineScroll.scrollTop + timelineStage.clientHeight - margin) {
            timelineScroll.scrollTop = Math.max(0, rowTop - timelineStage.clientHeight / 2);
          }
        }
        renderDetails(node);
      }

      function renderDetails(node) {
        details.replaceChildren();
        const title = document.createElement("h2");
        title.className = "detail-title";
        title.textContent = `${node.id} / ${node.kind}`;
        details.appendChild(title);
        const subtitle = document.createElement("div");
        subtitle.className = "detail-subtitle";
        subtitle.textContent = `${node.node_type} / ${node.id}`;
        details.appendChild(subtitle);

        const timingRows = [
          ["Dispatch", formatTick(node.timing.dispatch_tick)],
          ["Ready", formatTick(node.timing.ready_tick)],
          ["Issue", formatTick(node.timing.issue_tick)],
          ["Complete", formatTick(node.timing.complete_tick)],
          ["Retire", formatTick(node.timing.retire_tick)],
        ].filter(([, value]) => value !== "-");
        addGridSection("Timing", timingRows);

        addGridSection("Binding", [
          ["Instruction", node.parent_id],
          ["Assembly", node.provenance.assembly],
          ["Resource", node.abstract_resource],
          ["Execution parts", String(node.execution_uop_ids.length)],
        ]);
        addOperands("Sources", node.source_operands);
        addOperands("Destinations", node.destination_operands);
        addLinks("Execution part IDs", node.execution_uop_ids);

        const edges = data.dependencies;
        const incoming = edges.filter(edge => edge.target === node.id).map(edge => `${edge.source} (${edge.kind})`);
        const outgoing = edges.filter(edge => edge.source === node.id).map(edge => `${edge.target} (${edge.kind})`);
        addLinks("Dependencies", incoming, true);
        addLinks("Consumers", outgoing, true);
      }

      function addGridSection(name, values) {
        if (!values.length) return;
        const section = detailSection(name);
        const grid = document.createElement("div");
        grid.className = "detail-grid";
        for (const [key, value] of values) {
          const keyElement = document.createElement("div");
          keyElement.className = "detail-key";
          keyElement.textContent = key;
          const valueElement = document.createElement("div");
          valueElement.className = "detail-value";
          valueElement.textContent = value;
          grid.append(keyElement, valueElement);
        }
        section.appendChild(grid);
      }

      function addOperands(name, operands) {
        if (!operands || !operands.length) return;
        const section = detailSection(name);
        const list = document.createElement("div");
        list.className = "operand-list";
        for (const operand of operands) {
          const element = document.createElement("div");
          element.className = "operand";
          const operandName = document.createElement("div");
          operandName.className = "operand-name";
          operandName.textContent = operand.id;
          const operandMeta = document.createElement("div");
          operandMeta.className = "operand-meta";
          const lanes = operand.lane_count == null ? "" : ` x ${operand.lane_count}`;
          const width = operand.width_bits == null ? "" : ` / ${operand.width_bits} bits`;
          operandMeta.textContent = `${operand.kind} / ${operand.data_type}${lanes}${width}`;
          element.append(operandName, operandMeta);
          list.appendChild(element);
        }
        section.appendChild(list);
      }

      function addLinks(name, values, stripKind = false) {
        if (!values || !values.length) return;
        const section = detailSection(name);
        const list = document.createElement("div");
        list.className = "link-list";
        for (const value of values) {
          const id = stripKind ? value.replace(/ \([^)]*\)$/, "") : value;
          if (allNodes.has(id)) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "node-link";
            button.textContent = value;
            button.dataset.detailNodeId = id;
            list.appendChild(button);
          } else {
            const reference = document.createElement("div");
            reference.className = "node-reference";
            reference.textContent = value;
            list.appendChild(reference);
          }
        }
        section.appendChild(list);
      }

      function detailSection(name) {
        const section = document.createElement("section");
        section.className = "detail-section";
        const heading = document.createElement("h3");
        heading.textContent = name;
        section.appendChild(heading);
        details.appendChild(section);
        return section;
      }

      function formatTick(tick) {
        if (tick == null) return "-";
        return `${tick} tick / ${formatNumber(tick / tpc)} cycle`;
      }

      function formatNumber(value) {
        return Number(value).toLocaleString(undefined, {maximumFractionDigits: 3});
      }

      function setTimeMode(mode) {
        timeMode = mode;
        document.getElementById("cycleMode").classList.toggle("active", mode === "cycle");
        document.getElementById("tickMode").classList.toggle("active", mode === "tick");
        render();
      }

      function setBoardMode(mode) {
        boardMode = mode;
        const continuous = mode === "continuous";
        document.getElementById("continuousMode").classList.toggle("active", continuous);
        document.getElementById("discreteMode").classList.toggle("active", !continuous);
        for (const button of document.querySelectorAll("#zoomControls button")) {
          button.disabled = !continuous;
        }
        document.getElementById("waitingLegend").textContent = continuous ? "Waiting" : ". waiting";
        document.getElementById("executeLegend").textContent = continuous ? "Execute" : "x execute";
        document.getElementById("retireLegend").textContent = continuous ? "Retire" : "o retire";
        for (const id of ["waitingSwatch", "executeSwatch", "retireSwatch"]) {
          document.getElementById(id).style.display = continuous ? "inline-block" : "none";
        }
        timelineScroll.scrollLeft = 0;
        updateSpacer();
        render();
      }

      function setZoom(next, anchorX = timelineStage.clientWidth / 2) {
        if (boardMode !== "continuous") return;
        const previous = pxPerCycle;
        pxPerCycle = Math.min(1000, Math.max(0.15, next));
        const cycleAtAnchor = (timelineScroll.scrollLeft + anchorX - leftPad) / previous;
        updateSpacer();
        timelineScroll.scrollLeft = Math.max(0, cycleAtAnchor * pxPerCycle - anchorX + leftPad);
        render();
      }

      function fitTimeline() {
        if (boardMode !== "continuous") return;
        const available = Math.max(100, timelineStage.clientWidth - leftPad - rightPad);
        pxPerCycle = Math.max(0.15, available / Math.max(metadata.cycles, 1));
        timelineScroll.scrollLeft = 0;
        updateSpacer();
        render();
      }

      labelRows.addEventListener("click", event => {
        const row = event.target.closest("[data-node-id]");
        if (row) selectNode(row.dataset.nodeId);
      });

      labelStage.addEventListener("wheel", event => {
        if (!event.ctrlKey && !event.metaKey) {
          timelineScroll.scrollTop += event.deltaY;
          event.preventDefault();
        }
      }, {passive: false});

      timelineStage.addEventListener("click", event => {
        if (dragging) return;
        const index = Math.floor((event.clientY - timelineStage.getBoundingClientRect().top + timelineScroll.scrollTop) / rowHeight);
        if (rows[index]) selectNode(rows[index].node.id);
      });

      timelineStage.addEventListener("wheel", event => {
        if (boardMode === "continuous" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          const factor = Math.exp(-event.deltaY * 0.006);
          setZoom(pxPerCycle * factor, event.offsetX);
        }
      }, {passive: false});

      timelineStage.addEventListener("pointerdown", event => {
        if (event.button !== 1 && !event.shiftKey) return;
        dragging = {x: event.clientX, y: event.clientY, left: timelineScroll.scrollLeft, top: timelineScroll.scrollTop, moved: false};
        timelineStage.setPointerCapture(event.pointerId);
        timelineStage.style.cursor = "grabbing";
        event.preventDefault();
      });

      timelineStage.addEventListener("pointermove", event => {
        if (!dragging) return;
        const dx = event.clientX - dragging.x;
        const dy = event.clientY - dragging.y;
        dragging.moved = dragging.moved || Math.abs(dx) + Math.abs(dy) > 3;
        timelineScroll.scrollLeft = dragging.left - dx;
        timelineScroll.scrollTop = dragging.top - dy;
      });

      timelineStage.addEventListener("pointerup", () => {
        setTimeout(() => { dragging = null; }, 0);
        timelineStage.style.cursor = "";
      });

      timelineScroll.addEventListener("scroll", render);
      search.addEventListener("input", rebuildRows);
      search.addEventListener("keydown", event => {
        if (event.key !== "Enter") return;
        const query = search.value.trim();
        const exact = [...allNodes.keys()].find(id => id.toLowerCase() === query.toLowerCase());
        if (exact) selectNode(exact, true);
      });
      document.getElementById("continuousMode").addEventListener("click", () => setBoardMode("continuous"));
      document.getElementById("discreteMode").addEventListener("click", () => setBoardMode("discrete"));
      document.getElementById("cycleMode").addEventListener("click", () => setTimeMode("cycle"));
      document.getElementById("tickMode").addEventListener("click", () => setTimeMode("tick"));
      document.getElementById("zoomOut").addEventListener("click", () => setZoom(pxPerCycle / 2));
      document.getElementById("zoomIn").addEventListener("click", () => setZoom(pxPerCycle * 2));
      document.getElementById("fit").addEventListener("click", fitTimeline);
      details.addEventListener("click", event => {
        const button = event.target.closest("[data-detail-node-id]");
        if (button) selectNode(button.dataset.detailNodeId, true);
      });

      new ResizeObserver(resizeCanvas).observe(timelineStage);
      rebuildRows();
      requestAnimationFrame(() => {
        resizeCanvas();
        fitTimeline();
        if (data.semantic_uops.length) selectNode(data.semantic_uops[0].id);
      });
    })();
  </script>
</body>
</html>
